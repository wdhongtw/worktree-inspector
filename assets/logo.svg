<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-label="Git Worktree Inspector">
  <defs>
    <linearGradient id="canopy" x1="20" y1="14" x2="100" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="diffBadge" x1="64" y1="68" x2="114" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Tree Foliage / Worktree Canopy -->
  <circle cx="60" cy="44" r="30" fill="url(#canopy)"/>
  <circle cx="36" cy="56" r="22" fill="#10b981"/>
  <circle cx="84" cy="54" r="22" fill="#059669"/>

  <!-- Git Branch Trunk & Fork Lines -->
  <path d="M60 110V36" stroke="#ecfdf5" stroke-width="7" stroke-linecap="round"/>
  <path d="M60 76C60 64 40 64 38 52" stroke="#ecfdf5" stroke-width="6" stroke-linecap="round"/>
  <path d="M60 68C60 56 80 56 82 46" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>

  <!-- Git Commit Nodes on Tree -->
  <circle cx="60" cy="34" r="7" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
  <circle cx="38" cy="50" r="6.5" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
  <circle cx="82" cy="44" r="7" fill="#fde047" stroke="#047857" stroke-width="3"/>
  <circle cx="60" cy="108" r="7" fill="#34d399" stroke="#064e3b" stroke-width="3"/>

  <!-- Diff Inspector Pill Badge (Bottom Right) -->
  <rect x="64" y="70" width="50" height="44" rx="12" fill="url(#diffBadge)" stroke="#38bdf8" stroke-width="3"/>
  <path d="M74 85H82M78 81V89" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <rect x="87" y="82" width="18" height="6" rx="3" fill="#34d399"/>
  <path d="M74 100H82" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
  <rect x="87" y="97" width="14" height="6" rx="3" fill="#fb7185"/>
</svg>
